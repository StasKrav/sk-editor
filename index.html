<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stankrav Web Editor</title>
  </head>
  <body>
    <div id="app">
      <!-- Левая панель -->
      <aside id="sidebar">
        <div class="sidebar-toolbar">
          <button id="btn-open-folder" title="Открыть папку проекта">Открыть папку</button>
          <button id="btn-open-file" title="Открыть файл">Открыть файл</button>
          <button id="btn-refresh-tree" title="Обновить дерево файлов">⟳</button>
        </div>
        <div class="sidebar-tabs">
          <button data-mode="files" class="active">Files</button>
          <button data-mode="toc">TOC</button>
        </div>
        <div id="toc-filter" class="toc-filter" hidden>
          <input type="text" id="toc-filter-input" placeholder="Фильтр символов..." />
        </div>
        <div id="file-tree" class="sidebar-body"></div>
        <div id="toc-list" class="sidebar-body" hidden></div>
      </aside>

      <div id="resizer" title="Потяните, чтобы изменить ширину"></div>
      
      <!-- Правая часть -->
      <main id="main">
        <div id="tab-bar"></div>
        <div id="editor-container"></div>
      </main>
      
      <!-- Статусбар -->
      <footer id="status-bar">
        <!-- Обычный вид (виден, когда поиск закрыт) -->
        <div id="status-normal">
          <span id="status-msg">Готово</span>
          <div class="status-right">
            <span id="cursor-pos">1:1</span>
            <select id="theme-select" title="Тема">
              <option value="zenburn">Zenburn</option>
              <option value="light">Solarized Light</option>
            </select>
          </div>
        </div>
      
        <!-- Поиск (виден, когда поиск открыт) -->
        <div id="search-panel" hidden>
          <input type="text" id="search-input" placeholder="Найти..." />
          <input type="text" id="replace-input" placeholder="Заменить..." />
          <button id="search-prev" title="Предыдущее (Shift+Enter)">↑</button>
          <button id="search-next" title="Следующее (Enter)">↓</button>
          <button id="search-replace" title="Заменить">Заменить</button>
          <button id="search-replace-all" title="Заменить все">Все</button>
          <label class="search-case" title="Учитывать регистр">
            <input type="checkbox" id="search-case-sensitive" /> Aa
          </label>
          <button id="search-close" title="Закрыть (Esc)">×</button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
